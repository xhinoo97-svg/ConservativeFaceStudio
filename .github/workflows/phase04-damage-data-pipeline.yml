name: Phase04 Damage Data Pipeline

on:
  push:
    branches:
      - integration/final-paper-quality-local
    paths:
      - research/build_damage_source_bank.py
      - research/damage_mask_dataset.py
      - app/damage_taxonomy.py
      - tests/test_damage_source_bank.py
      - tests/test_damage_mask_dataset.py
      - requirements.txt
      - .github/workflows/phase04-damage-data-pipeline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  damage-data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<9'
      - name: Compile Phase04 data pipeline
        run: python -m compileall -q research/build_damage_source_bank.py research/damage_mask_dataset.py app/damage_taxonomy.py
      - name: Verify deterministic source bank and exact mask authority
        run: python -m pytest -q tests/test_damage_source_bank.py tests/test_damage_mask_dataset.py
