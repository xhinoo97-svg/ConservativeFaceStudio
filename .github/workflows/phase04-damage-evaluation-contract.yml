name: Phase04 Damage Evaluation Contract

on:
  push:
    branches:
      - integration/final-paper-quality-local
    paths:
      - research/phase04_damage_evaluation.py
      - research/phase04_expanded_damage_generator.py
      - research/phase04_training_dataset.py
      - tests/test_phase04_damage_evaluation.py
      - tests/test_phase04_training_dataset.py
      - .github/workflows/phase04-damage-evaluation-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-evaluation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install contract test dependencies
        run: python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5'
      - name: Compile Phase04 evaluation and training contracts
        run: python -m compileall -q research/phase04_damage_evaluation.py research/phase04_expanded_damage_generator.py research/phase04_training_dataset.py
      - name: Execute frozen matrix gate and training-target tests
        run: python -m pytest -q tests/test_phase04_damage_evaluation.py tests/test_phase04_training_dataset.py
      - name: Materialize declared matrix
        run: python research/phase04_damage_evaluation.py --output .phase04/phase04-damage-evaluation-matrix.json
      - name: Upload declared matrix evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase04-damage-evaluation-matrix-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: .phase04/phase04-damage-evaluation-matrix.json
