name: Phase04 DeepLab Full Matrix Development Windows

on:
  push:
    branches:
      - integration/final-paper-quality-local
    paths:
      - research/phase04_damage_evaluation.py
      - research/phase04_expanded_damage_generator.py
      - research/phase04_training_dataset.py
      - research/phase04_balanced_sampler.py
      - research/phase04_deeplab_challenger.py
      - research/train_phase04_deeplab_challenger.py
      - research/evaluate_phase04_deeplab_checkpoint.py
      - scripts/prefetch_public_portraits.py
      - requirements.txt
      - requirements-paper-quality-cpu.txt
      - .github/workflows/phase04-deeplab-fullmatrix-development-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deeplab-full-matrix-development:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install coherent Windows CPU training runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-paper-quality-cpu.txt
          python -m pip check
      - name: Acquire and verify frozen official MobileNetV3 backbone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .phase04/backbone
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import sys
          sys.path.insert(0, 'research')
          from damage_mask_lraspp_contract import BACKBONE_URL, verify_backbone_checkpoint
          target = Path('.phase04/backbone/mobilenet_v3_large-8738ca79.pth')
          request = Request(BACKBONE_URL, headers={'User-Agent': 'ConservativeFaceStudio-Research/2.0'})
          with urlopen(request, timeout=120) as response:
              target.write_bytes(response.read())
          print({'sha256': verify_backbone_checkpoint(target), 'bytes': target.stat().st_size})
          PY
      - name: Fetch eight public-domain DEVELOPMENT portraits
        shell: bash
        run: python scripts/prefetch_public_portraits.py --cache .phase04/public --limit 8
      - name: Build identity-disjoint real-portrait development split
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source_dir = Path('.phase04/public')
          prefetched = json.loads((source_dir / 'prefetch-manifest.json').read_text(encoding='utf-8'))
          resolved = prefetched['resolved']
          assert len(resolved) == 8 and not prefetched['failures']
          rows = []
          for index, row in enumerate(resolved):
              path = source_dir / f"{row['key']}.jpg"
              assert path.is_file()
              rows.append({
                  'source_id': f"public_development_{row['key']}",
                  'filename': path.name,
                  'clean_source_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'face_bbox_normalized': [0.0, 0.0, 1.0, 1.0],
                  'dataset_split': 'train' if index < 6 else 'validation',
                  'identity_key': f"public-development:{row['key']}",
                  'license': 'US_GOVERNMENT_PUBLIC_DOMAIN',
              })
          manifest = {
              'version': 1,
              'purpose': 'Phase04 DeepLab full-matrix DEVELOPMENT training; not final holdout',
              'final_holdout_used': False,
              'v3_used': False,
              'v4_used': False,
              'sources': rows,
          }
          Path('.phase04/development-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          PY
      - name: Train exactly one complete balanced Phase04 matrix epoch
        shell: bash
        run: |
          set -euo pipefail
          python research/train_phase04_deeplab_challenger.py \
            --source-dir .phase04/public \
            --manifest .phase04/development-manifest.json \
            --backbone .phase04/backbone/mobilenet_v3_large-8738ca79.pth \
            --output .phase04/evidence/phase04-deeplab-fullmatrix-epoch1.pth \
            --report .phase04/evidence/phase04-deeplab-fullmatrix-epoch1-training.json \
            --image-size 128 \
            --batch-size 2 \
            --max-steps 518 \
            --learning-rate 0.0003 \
            --seed 240905
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.phase04/evidence/phase04-deeplab-fullmatrix-epoch1-training.json').read_text(encoding='utf-8'))
          assert report['balanced_full_matrix_sampler'] is True
          assert report['training_sample_count'] == 1036
          assert report['unique_matrix_cases_seen'] == 1036
          assert report['complete_matrix_epochs'] == 1
          assert report['source_count'] == 6
          assert report['final_holdout_used'] is False
          assert report['v3_used'] is False and report['v4_used'] is False
          print(report)
          PY
      - name: Measure trained checkpoint on two unseen real identities and all 1036 cases
        shell: bash
        run: |
          set -euo pipefail
          python research/evaluate_phase04_deeplab_checkpoint.py \
            --checkpoint .phase04/evidence/phase04-deeplab-fullmatrix-epoch1.pth \
            --source-dir .phase04/public \
            --manifest .phase04/development-manifest.json \
            --output .phase04/evidence/phase04-deeplab-fullmatrix-epoch1-evaluation.json \
            --threshold 0.55 \
            --image-size 128 \
            --seed 240905
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.phase04/evidence/phase04-deeplab-fullmatrix-epoch1-evaluation.json').read_text(encoding='utf-8'))
          assert report['data']['identity_disjoint'] is True
          assert report['data']['validation_identity_count'] == 2
          assert report['data']['completed_cases'] == 2072
          assert report['data']['error_cases'] == 0
          assert report['data']['final_holdout_used'] is False
          assert report['production_qualified'] is False
          print({'disposition': report['disposition'], 'binary': report['metrics']['binary'], 'groups': report['metrics']['groups'], 'gate': report['frozen_phase04_gate']})
          PY
      - name: Upload full-matrix DEVELOPMENT evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase04-deeplab-fullmatrix-development-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: .phase04/evidence/
