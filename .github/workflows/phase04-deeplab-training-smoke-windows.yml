name: Phase04 DeepLab Training Smoke Windows

on:
  push:
    branches:
      - integration/final-paper-quality-local
    paths:
      - research/phase04_damage_evaluation.py
      - research/phase04_expanded_damage_generator.py
      - research/phase04_training_dataset.py
      - research/phase04_deeplab_challenger.py
      - research/train_phase04_deeplab_challenger.py
      - scripts/prefetch_public_portraits.py
      - requirements.txt
      - requirements-paper-quality-cpu.txt
      - .github/workflows/phase04-deeplab-training-smoke-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deeplab-development-training-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install coherent Windows CPU training runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-paper-quality-cpu.txt
          python -m pip check
      - name: Acquire and verify frozen official MobileNetV3 backbone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .phase04/backbone
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import sys
          sys.path.insert(0, 'research')
          from damage_mask_lraspp_contract import BACKBONE_URL, verify_backbone_checkpoint
          target = Path('.phase04/backbone/mobilenet_v3_large-8738ca79.pth')
          if not target.is_file():
              request = Request(BACKBONE_URL, headers={'User-Agent': 'ConservativeFaceStudio-Research/2.0'})
              with urlopen(request, timeout=120) as response:
                  target.write_bytes(response.read())
          print({'sha256': verify_backbone_checkpoint(target), 'bytes': target.stat().st_size})
          PY
      - name: Fetch eight public-domain DEVELOPMENT portraits
        shell: bash
        run: python scripts/prefetch_public_portraits.py --cache .phase04/public --limit 8
      - name: Build smoke-only identity-disjoint train/validation manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source_dir = Path('.phase04/public')
          prefetched = json.loads((source_dir / 'prefetch-manifest.json').read_text(encoding='utf-8'))
          resolved = prefetched['resolved']
          assert len(resolved) == 8 and not prefetched['failures']
          rows = []
          for index, row in enumerate(resolved):
              path = Path(row['path']) if 'path' in row else source_dir / f"{row['key']}.jpg"
              if not path.is_file():
                  path = source_dir / f"{row['key']}.jpg"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              split = 'train' if index < 6 else 'validation'
              rows.append({
                  'source_id': f"smoke_{row['key']}",
                  'filename': path.name,
                  'clean_source_sha256': digest,
                  'face_bbox_normalized': [0.0, 0.0, 1.0, 1.0],
                  'dataset_split': split,
                  'identity_key': f"public-smoke:{row['key']}",
                  'license': 'US_GOVERNMENT_PUBLIC_DOMAIN',
              })
          manifest = {
              'version': 1,
              'purpose': 'Phase04 DeepLab training-path smoke only; never quality qualification',
              'final_holdout_used': False,
              'v3_used': False,
              'v4_used': False,
              'sources': rows,
          }
          Path('.phase04/smoke-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          PY
      - name: Execute deterministic four-step DeepLab training smoke
        shell: bash
        run: |
          set -euo pipefail
          python research/train_phase04_deeplab_challenger.py \
            --source-dir .phase04/public \
            --manifest .phase04/smoke-manifest.json \
            --backbone .phase04/backbone/mobilenet_v3_large-8738ca79.pth \
            --output .phase04/evidence/phase04-deeplab-smoke.pth \
            --report .phase04/evidence/phase04-deeplab-smoke-report.json \
            --image-size 128 \
            --batch-size 2 \
            --max-steps 4 \
            --learning-rate 0.0003 \
            --seed 240905
      - name: Verify checkpoint reload and CPU inference
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          import torch
          sys.path.insert(0, 'research')
          from phase04_deeplab_challenger import Phase04DeepLabDamageModel
          checkpoint = Path('.phase04/evidence/phase04-deeplab-smoke.pth')
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          model = Phase04DeepLabDamageModel.from_trained_checkpoint(checkpoint=checkpoint, expected_sha256=digest).eval()
          with torch.inference_mode():
              logits = model(torch.zeros((1, 3, 128, 128), dtype=torch.float32))
          assert tuple(logits.shape) == (1, 18, 128, 128)
          report = json.loads(Path('.phase04/evidence/phase04-deeplab-smoke-report.json').read_text(encoding='utf-8'))
          assert report['batch_size'] == 2
          assert report['final_holdout_used'] is False
          assert report['v3_used'] is False and report['v4_used'] is False
          assert report['production_qualified'] is False
          assert report['quality_gate_measured'] is False
          print({'checkpoint_sha256': digest, 'logits_shape': list(logits.shape), 'training_report': report})
          PY
      - name: Upload non-qualifying training-path evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase04-deeplab-training-smoke-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: .phase04/evidence/
