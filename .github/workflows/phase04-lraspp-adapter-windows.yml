name: Phase04 Segmentation Adapters Windows

on:
  push:
    branches:
      - integration/final-paper-quality-local
    paths:
      - research/damage_mask_lraspp.py
      - research/damage_mask_lraspp_contract.py
      - research/phase04_training_dataset.py
      - research/phase04_deeplab_challenger.py
      - tests/test_phase04_lraspp_adapter.py
      - tests/test_phase04_deeplab_challenger.py
      - requirements.txt
      - requirements-paper-quality-cpu.txt
      - .github/workflows/phase04-lraspp-adapter-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segmentation-adapter-contract:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install coherent Windows CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<9'
          python -m pip install -r requirements-paper-quality-cpu.txt
          python -m pip check
          python - <<'PY'
          import cv2, numpy, torch, torchvision
          print({'opencv': cv2.__version__, 'numpy': numpy.__version__, 'torch': torch.__version__, 'torchvision': torchvision.__version__, 'cuda': torch.cuda.is_available()})
          assert cv2.__version__.startswith('5.')
          assert numpy.__version__.startswith('2.')
          assert torch.__version__ == '2.14.0+cpu'
          assert torchvision.__version__ == '0.29.0+cpu'
          assert torch.cuda.is_available() is False
          PY
      - name: Compile segmentation adapters
        shell: bash
        run: python -m compileall -q research/damage_mask_lraspp.py research/damage_mask_lraspp_contract.py research/phase04_training_dataset.py research/phase04_deeplab_challenger.py
      - name: Execute LRASPP and DeepLab adapter contracts
        shell: bash
        run: python -m pytest -q tests/test_phase04_lraspp_adapter.py tests/test_phase04_deeplab_challenger.py
