name: Protocol V5 hardening DEV

on:
  push:
    branches:
      - protocol/v5-certification-hardening
    paths:
      - ".github/workflows/protocol-v5-hardening.yml"
      - "app/one_shot_certification.py"
      - "scripts/frozen_benchmark_adapter.py"
      - "scripts/run_face_smartphone_baseline.py"
      - "scripts/run_one_shot_protocol_dev.py"
      - "tests/test_frozen_benchmark_adapter.py"
      - "tests/test_one_shot_protocol_dev.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-hardening-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run targeted runner tests
        run: |
          mkdir -p protocol-hardening-evidence/logs
          python -m pytest -q \
            tests/test_frozen_benchmark_adapter.py \
            tests/test_one_shot_protocol_dev.py \
            | tee protocol-hardening-evidence/logs/targeted-pytest.log

      - name: Run complete test suite
        run: |
          python -m pytest -q \
            | tee protocol-hardening-evidence/logs/full-pytest.log

      - name: Exercise success and failure ordering
        shell: bash
        run: |
          python scripts/run_one_shot_protocol_dev.py \
            --output protocol-hardening-evidence/success \
            | tee protocol-hardening-evidence/logs/dev-success.log

          set +e
          python scripts/run_one_shot_protocol_dev.py \
            --output protocol-hardening-evidence/failure-before-marker \
            --inject-failure before_marker \
            > protocol-hardening-evidence/logs/dev-failure-before-marker.log 2>&1
          before_status=$?
          python scripts/run_one_shot_protocol_dev.py \
            --output protocol-hardening-evidence/failure-after-marker \
            --inject-failure after_marker \
            > protocol-hardening-evidence/logs/dev-failure-after-marker.log 2>&1
          after_status=$?
          set -e

          test "$before_status" -eq 2
          test "$after_status" -eq 2

          sha256sum \
            protocol-hardening-evidence/success/protocol-hardening-evidence.zip \
            protocol-hardening-evidence/failure-before-marker/protocol-hardening-evidence.zip \
            protocol-hardening-evidence/failure-after-marker/protocol-hardening-evidence.zip \
            > protocol-hardening-evidence/artifacts.sha256

      - name: Upload DEV hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-v5-hardening-${{ github.run_id }}
          path: protocol-hardening-evidence
          if-no-files-found: error
          retention-days: 30
