name: Research Candidate Selector V2

on:
  push:
    branches:
      - research/paper-quality-local-v2
    paths:
      - app/candidate_selector_v2.py
      - app/face_restorer_adapter.py
      - app/resource_budget.py
      - tests/test_candidate_selector_v2.py
      - .github/workflows/research-candidate-selector-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-selector-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install narrow dependencies
        run: python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3'
      - name: Verify hard gates precede calibrated ranking
        run: python -m pytest -q tests/test_candidate_selector_v2.py
