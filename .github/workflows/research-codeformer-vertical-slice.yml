name: Research CodeFormer vertical slice

on:
  push:
    branches:
      - research/paper-quality-local-v2
    paths:
      - research/run_codeformer_vertical_slice.py
      - .github/workflows/research-codeformer-vertical-slice.yml
      - app/core_models.py
      - app/model_registry.py
      - app/opencv_zoo_face.py
      - app/face_analysis.py
      - app/pretrained_values.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-codeformer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-cpu-vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      CODEFORMER_SOURCE_SHA: b33cc7d639d6545bfcccc7e0bc6ae51f24e79c2b
      CODEFORMER_WEIGHT_URL: https://github.com/sczhou/CodeFormer/releases/download/v0.1.0/codeformer.pth
      DEV_SOURCE_URL: https://upload.wikimedia.org/wikipedia/commons/7/79/A_lady_at_front_day.jpg
      DEV_SOURCE_SHA256: 6853c64a4a74a09481ef260ff953562ac65628e39d56cb30d58e7035125c7e0a

    steps:
      - name: Checkout research branch commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install isolated CPU runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.1.2+cpu' 'torchvision==0.16.2+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            'numpy>=1.26,<2' 'opencv-python>=4.10,<5' 'onnxruntime>=1.20,<2' \
            'psutil>=5.9,<8' 'scipy>=1.10,<2' 'scikit-image>=0.22,<1' \
            'Pillow>=10,<12' 'pyyaml>=6,<7' 'lmdb>=1.4,<2' 'requests>=2.31,<3' \
            'tqdm>=4.64,<5' 'yapf>=0.40,<1' 'addict>=2.4,<3' 'future>=1,<2' \
            'lpips>=0.1.4,<1' 'tensorboard>=2.15,<3'
          python - <<'PY'
          import torch, torchvision, cv2, numpy, onnxruntime
          print({'torch': torch.__version__, 'torchvision': torchvision.__version__, 'opencv': cv2.__version__, 'numpy': numpy.__version__, 'onnxruntime': onnxruntime.__version__, 'cuda': torch.cuda.is_available()})
          assert not torch.cuda.is_available()
          PY

      - name: Fetch exact official CodeFormer source
        run: |
          set -euo pipefail
          rm -rf .research/CodeFormer
          git clone --filter=blob:none https://github.com/sczhou/CodeFormer.git .research/CodeFormer
          git -C .research/CodeFormer checkout --detach "$CODEFORMER_SOURCE_SHA"
          test "$(git -C .research/CodeFormer rev-parse HEAD)" = "$CODEFORMER_SOURCE_SHA"

      - name: Download official CodeFormer checkpoint
        run: |
          set -euo pipefail
          mkdir -p .research/weights
          tmp=.research/weights/codeformer.pth.part
          dst=.research/weights/codeformer.pth
          rm -f "$tmp" "$dst"
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 600 "$CODEFORMER_WEIGHT_URL" -o "$tmp"
          test -s "$tmp"
          test "$(stat -c%s "$tmp")" -eq 376637898
          mv "$tmp" "$dst"
          sha256sum "$dst" | tee .research/codeformer-checkpoint-sha256.txt

      - name: Download same V1 development source and verify hash
        run: |
          set -euo pipefail
          mkdir -p .research/input
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 180 "$DEV_SOURCE_URL" -o .research/input/A_lady_at_front_day.jpg
          test "$(sha256sum .research/input/A_lady_at_front_day.jpg | awk '{print $1}')" = "$DEV_SOURCE_SHA256"

      - name: Execute real CodeFormer CPU vertical slice w=0.5
        run: |
          set -euo pipefail
          python research/run_codeformer_vertical_slice.py \
            --input .research/input/A_lady_at_front_day.jpg \
            --expected-input-sha256 "$DEV_SOURCE_SHA256" \
            --codeformer-root .research/CodeFormer \
            --checkpoint .research/weights/codeformer.pth \
            --source-sha "$CODEFORMER_SOURCE_SHA" \
            --fidelity-weight 0.5 \
            --threads 4 \
            --output research-results/codeformer-w05-v1

      - name: Verify evidence bundle
        run: |
          set -euo pipefail
          test -s research-results/codeformer-w05-v1/report.json
          test -s research-results/codeformer-w05-v1/restored_codeformer_w05.png
          test -s research-results/codeformer-w05-v1/comparison.png
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research-results/codeformer-w05-v1/report.json').read_text())
          assert r['source']['final_holdout_used'] is False
          assert r['model']['device'] == 'cpu'
          assert r['model']['fidelity_weight'] == 0.5
          assert r['metrics']['sface_identity_gate_pass'] is True
          assert r['production_qualified'] is False
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - name: Upload real vertical-slice evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codeformer-w05-real-cpu-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            research-results/codeformer-w05-v1/**
            .research/codeformer-checkpoint-sha256.txt
