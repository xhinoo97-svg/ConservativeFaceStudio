name: Research Component Aware Fusion V2

on:
  push:
    branches:
      - research/paper-quality-local-v2
    paths:
      - app/component_aware_fusion_v2.py
      - app/component_bank.py
      - app/face_restorer_adapter.py
      - app/personalized_reference_bank.py
      - tests/test_component_aware_fusion_v2.py
      - .github/workflows/research-component-aware-fusion-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fusion-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install narrow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3' 'opencv-python>=4.10,<5'
      - name: Verify MAIN/reference/generated authority ordering
        run: python -m pytest -q tests/test_component_aware_fusion_v2.py
