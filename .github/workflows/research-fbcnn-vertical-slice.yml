name: Research FBCNN JPEG specialist vertical slice

on:
  push:
    branches:
      - research/paper-quality-local-v2
    paths:
      - research/run_fbcnn_vertical_slice.py
      - research/fbcnn_degradation_matrix.py
      - research/summarize_fbcnn_degradation_matrix.py
      - app/fbcnn_upstream_backend.py
      - app/face_restorer_adapter.py
      - app/resource_budget.py
      - app/core_models.py
      - app/model_registry.py
      - app/opencv_zoo_face.py
      - app/face_analysis.py
      - app/pretrained_values.py
      - config/upstream-implementations.json
      - scripts/bootstrap_pinned_upstream.py
      - scripts/verify_upstream_implementation_registry.py
      - tests/test_fbcnn_upstream_backend.py
      - tests/test_fbcnn_degradation_matrix.py
      - tests/test_upstream_implementation_registry.py
      - .github/workflows/research-fbcnn-vertical-slice.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-fbcnn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-cpu-jpeg-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      FBCNN_SOURCE_SHA: 54d1831927506b3247e2d4d245abb4f4dab1a1cd
      FBCNN_WEIGHT_URL: https://github.com/jiaxi-jiang/FBCNN/releases/download/v1.0/fbcnn_color.pth
      DEV_SOURCE_URL: https://upload.wikimedia.org/wikipedia/commons/7/79/A_lady_at_front_day.jpg
      DEV_SOURCE_SHA256: 6853c64a4a74a09481ef260ff953562ac65628e39d56cb30d58e7035125c7e0a

    steps:
      - name: Checkout research branch commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install isolated CPU runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.1.2+cpu' 'torchvision==0.16.2+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            'numpy>=1.26,<2' \
            'opencv-python>=4.10,<5' \
            'onnxruntime>=1.20,<2' \
            'Pillow>=10,<12' \
            'psutil>=5.9,<8' \
            pytest
          python - <<'PY'
          import cv2, numpy, onnxruntime, torch, torchvision
          print({
              'torch': torch.__version__,
              'torchvision': torchvision.__version__,
              'opencv': cv2.__version__,
              'numpy': numpy.__version__,
              'onnxruntime': onnxruntime.__version__,
              'cuda': torch.cuda.is_available(),
          })
          assert not torch.cuda.is_available()
          PY

      - name: Verify upstream-first registry and FBCNN guards
        run: |
          set -euo pipefail
          python scripts/verify_upstream_implementation_registry.py
          python -m pytest -q \
            tests/test_upstream_implementation_registry.py \
            tests/test_fbcnn_upstream_backend.py \
            tests/test_fbcnn_degradation_matrix.py

      - name: Bootstrap exact official FBCNN checkout
        run: |
          set -euo pipefail
          rm -rf .research-upstreams/fbcnn
          python scripts/bootstrap_pinned_upstream.py fbcnn \
            --destination .research-upstreams \
            --accept-research-only
          test "$(git -C .research-upstreams/fbcnn rev-parse HEAD)" = "$FBCNN_SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.research-upstreams/fbcnn/.cfs-upstream.json').read_text())
          assert p['official_repository'] == 'jiaxi-jiang/FBCNN'
          assert p['pinned_revision'] == '54d1831927506b3247e2d4d245abb4f4dab1a1cd'
          assert p['actual_revision'] == p['pinned_revision']
          assert p['architecture_reimplemented_by_cfs'] is False
          print(json.dumps(p, indent=2, sort_keys=True))
          PY

      - name: Download official FBCNN color checkpoint and discover digest
        run: |
          set -euo pipefail
          mkdir -p .research/weights
          tmp=.research/weights/fbcnn_color.pth.part
          dst=.research/weights/fbcnn_color.pth
          rm -f "$tmp" "$dst"
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 600 "$FBCNN_WEIGHT_URL" -o "$tmp"
          test -s "$tmp"
          test "$(stat -c%s "$tmp")" -eq 287755111
          mv "$tmp" "$dst"
          FBCNN_WEIGHT_SHA256="$(sha256sum "$dst" | awk '{print $1}')"
          test "${#FBCNN_WEIGHT_SHA256}" -eq 64
          echo "FBCNN_WEIGHT_SHA256=$FBCNN_WEIGHT_SHA256" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$FBCNN_WEIGHT_SHA256" "$dst" | tee .research/fbcnn-checkpoint-sha256.txt

      - name: Download development source and verify hash
        run: |
          set -euo pipefail
          mkdir -p .research/input
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 180 "$DEV_SOURCE_URL" -o .research/input/A_lady_at_front_day.jpg
          test "$(sha256sum .research/input/A_lady_at_front_day.jpg | awk '{print $1}')" = "$DEV_SOURCE_SHA256"

      - name: Execute real pinned-upstream FBCNN CPU JPEG specialist slice
        run: |
          set -euo pipefail
          profiles=(
            jpeg-qf10-block-heavy
            jpeg-qf20
            jpeg-qf40
            double-jpeg-qf40-qf15
            social-resize-jpeg-qf20
            mosquito-edges-qf12
          )
          reports=()
          for profile in "${profiles[@]}"; do
            output="research-results/fbcnn-compression-dev-matrix/$profile"
            python research/run_fbcnn_vertical_slice.py \
              --input .research/input/A_lady_at_front_day.jpg \
              --expected-input-sha256 "$DEV_SOURCE_SHA256" \
              --fbcnn-root .research-upstreams/fbcnn \
              --checkpoint .research/weights/fbcnn_color.pth \
              --expected-checkpoint-sha256 "$FBCNN_WEIGHT_SHA256" \
              --source-sha "$FBCNN_SOURCE_SHA" \
              --degradation-profile "$profile" \
              --core-model-root .research/cfs-core-models \
              --threads 4 \
              --output "$output"
            reports+=(--report "$output/report.json")
          done
          python research/summarize_fbcnn_degradation_matrix.py \
            "${reports[@]}" \
            --output research-results/fbcnn-compression-dev-matrix/summary.json

      - name: Verify evidence bundle
        run: |
          set -euo pipefail
          test -s research-results/fbcnn-compression-dev-matrix/summary.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('research-results/fbcnn-compression-dev-matrix')
          summary = json.loads((root / 'summary.json').read_text())
          assert summary['fixture_policy'] == 'PUBLIC_DEVELOPMENT_ONLY_NO_FINAL_HOLDOUT'
          assert summary['completed_cases'] == 6
          assert summary['error_cases'] == 0
          assert summary['wrong_person_final_pixels'] == 0
          assert summary['provenance_violations'] == 0
          assert summary['checkpoint_sha256'] == os.environ['FBCNN_WEIGHT_SHA256']
          assert summary['official_source_commit'] == '54d1831927506b3247e2d4d245abb4f4dab1a1cd'
          assert summary['production_qualified'] is False
          for case in summary['cases']:
              report = json.loads((root / case['profile_id'] / 'report.json').read_text())
              assert report['source']['final_holdout_used'] is False
              assert report['model']['device'] == 'cpu'
              assert report['model']['architecture_reimplemented_by_cfs'] is False
              assert report['model']['provenance_class'] == 'GENERATED_MODEL_INFERRED'
              assert report['resource_budget']['max_total_pc_fraction'] == 0.80
              assert report['resource_budget']['max_parallel_heavy_models'] == 1
              assert report['provenance']['wrong_person_final_pixels'] == 0
              assert report['provenance']['violations'] == 0
              assert (root / case['profile_id'] / 'final.png').is_file()
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload real FBCNN evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fbcnn-compression-dev-matrix-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            research-results/fbcnn-compression-dev-matrix/**
            .research/fbcnn-checkpoint-sha256.txt
            .research-upstreams/fbcnn/.cfs-upstream.json
