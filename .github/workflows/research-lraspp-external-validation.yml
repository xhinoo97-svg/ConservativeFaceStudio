name: Research LRASPP external validation

on:
  push:
    branches:
      - research/paper-quality-local-v2
    paths:
      - research/build_controlface_mask_validation_bank.py
      - research/evaluate_lraspp_external_validation.py
      - tests/test_lraspp_external_validation.py
      - .github/workflows/research-lraspp-external-validation.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: research-lraspp-external-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-checkpoint-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/research
      PRIOR_ARTIFACT_ID: '9502642834'
      PRIOR_ARTIFACT_SHA256: 0bef114cfeed95ebcceb81ce8f5dfc43c3fdb37bca82c69a346ed6219c137a11
      CHECKPOINT_SHA256: d510e6991cca582c3696b6b9132bf3fdb7948e240f4bf136440d8b75046910f4
      ONNX_SHA256: 708c7e9c074b2abf98dc95b8e74b3b76d687a63fb2a54a3e374db0bef37ae3a9

    steps:
      - name: Checkout exact Track B commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip

      - name: Install isolated CPU validation runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'torch==2.1.2+cpu' \
            'torchvision==0.16.2+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            'pytest>=8,<9' \
            'numpy>=1.26,<2' \
            'opencv-python>=4.10,<5' \
            'onnxruntime>=1.20,<2' \
            'psutil>=5.9,<8' \
            'remotezip==0.12.3' \
            'requests>=2.32,<3' \
            'packaging>=24,<27'
          python - <<'PY'
          import torch, torchvision
          assert torch.__version__ == '2.1.2+cpu'
          assert torchvision.__version__ == '0.16.2+cpu'
          assert not torch.cuda.is_available()
          print({'torch': torch.__version__, 'torchvision': torchvision.__version__, 'cuda': False})
          PY

      - name: Verify external-validation contract
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_damage_mask_lraspp_contract.py \
            tests/test_lraspp_external_validation.py

      - name: Download exact frozen LRASPP artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research/prior-lraspp
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRIOR_ARTIFACT_ID}/zip" \
            --output .research/prior-lraspp.zip
          test "$(sha256sum .research/prior-lraspp.zip | awk '{print $1}')" = "$PRIOR_ARTIFACT_SHA256"
          unzip -q .research/prior-lraspp.zip -d .research/prior-lraspp
          root=.research/prior-lraspp/research-results/damage-mask-lraspp-v1
          test "$(sha256sum "$root/damage_mask_lraspp_dev.pth" | awk '{print $1}')" = "$CHECKPOINT_SHA256"
          test "$(sha256sum "$root/damage_mask_lraspp_dev.onnx" | awk '{print $1}')" = "$ONNX_SHA256"
          test -s .research/prior-lraspp/.research/damage-mask-lraspp-source-bank.json

      - name: Build 40-identity balanced external validation bank
        run: |
          set -euo pipefail
          python research/build_controlface_mask_validation_bank.py \
            --output-dir .research/lraspp-external-sources \
            --manifest .research/lraspp-external-validation.json \
            --exclude-manifest .research/prior-lraspp/.research/damage-mask-lraspp-source-bank.json \
            --identities-per-stratum 5
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.research/lraspp-external-validation.json').read_text())
          assert manifest['counts'] == {'identities': 40, 'female': 20, 'male': 20}
          assert manifest['identity_disjoint_from_prior_lraspp_bank'] is True
          assert manifest['training_or_tuning_authorized'] is False
          assert manifest['final_holdout_used'] is False
          assert set(manifest['selection']['stratum_counts'].values()) == {5}
          assert len(manifest['selection']['stratum_counts']) == 8
          print(json.dumps(manifest['selection'], indent=2, sort_keys=True))
          PY

      - name: Evaluate frozen checkpoint and ONNX without retraining
        run: |
          set -euo pipefail
          root=.research/prior-lraspp/research-results/damage-mask-lraspp-v1
          python research/evaluate_lraspp_external_validation.py \
            --manifest .research/lraspp-external-validation.json \
            --source-dir .research/lraspp-external-sources \
            --checkpoint "$root/damage_mask_lraspp_dev.pth" \
            --expected-checkpoint-sha256 "$CHECKPOINT_SHA256" \
            --onnx "$root/damage_mask_lraspp_dev.onnx" \
            --expected-onnx-sha256 "$ONNX_SHA256" \
            --output research-results/lraspp-external-validation-v1 \
            --face-size 192 \
            --repetitions 2 \
            --batch-size 8 \
            --seed 240824

      - name: Verify evidence without changing the frozen gate
        run: |
          set -euo pipefail
          test -s research-results/lraspp-external-validation-v1/report.json
          test -s research-results/lraspp-external-validation-v1/external_validation_example.png
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path('research-results/lraspp-external-validation-v1/report.json').read_text()
          )
          assert report['model']['checkpoint_sha256'] == 'd510e6991cca582c3696b6b9132bf3fdb7948e240f4bf136440d8b75046910f4'
          assert report['model']['onnx_sha256'] == '708c7e9c074b2abf98dc95b8e74b3b76d687a63fb2a54a3e374db0bef37ae3a9'
          assert report['model']['retrained_or_tuned'] is False
          assert report['data']['identity_count'] == 40
          assert report['data']['completed_cases'] == 880
          assert report['data']['error_cases'] == 0
          assert report['data']['identity_disjoint_from_prior_lraspp_bank'] is True
          assert report['data']['final_holdout_used'] is False
          assert report['validation']['frozen_development_gate']['thresholds_frozen_before_run'] is True
          assert report['runtime']['checkpoint_onnx_first_batch_argmax_equal'] is True
          assert report['runtime']['checkpoint_onnx_first_batch_max_abs'] < 1e-3
          assert report['safety']['wrong_person_final_pixels'] == 0
          assert report['safety']['provenance_violations'] == 0
          assert report['safety']['refface_execution_authorized'] is False
          assert report['target95'] == 'NOT_MEASURED'
          print(json.dumps({
              'disposition': report['disposition'],
              'completed_cases': report['data']['completed_cases'],
              'damage_macro_f1': report['validation']['damage_macro_f1'],
              'damage_macro_iou': report['validation']['damage_macro_iou'],
              'minimum_damage_class_f1': report['validation']['minimum_damage_class_f1'],
              'binary_damage_mask': report['validation']['binary_damage_mask'],
              'gate_pass': report['validation']['frozen_development_gate']['passed'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload external validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lraspp-external-validation-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            research-results/lraspp-external-validation-v1/**
            .research/lraspp-external-validation.json
