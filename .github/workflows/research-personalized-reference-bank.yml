name: Research Personalized Reference Bank

on:
  push:
    branches:
      - research/paper-quality-local-v2
    paths:
      - app/personalized_reference_bank.py
      - app/reference_limits.py
      - tests/test_personalized_reference_bank.py
      - .github/workflows/research-personalized-reference-bank.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-bank-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install narrow dependencies
        run: python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3'
      - name: Verify identity and per-component authority invariants
        run: python -m pytest -q tests/test_personalized_reference_bank.py
