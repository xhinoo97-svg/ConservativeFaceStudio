name: Research Reference First Route

on:
  push:
    branches:
      - research/paper-quality-local-v2
    paths:
      - app/reference_first_route.py
      - app/reference_inpainting.py
      - app/personalized_component_selector.py
      - app/personalized_reference_bank.py
      - app/component_bank.py
      - app/damage_mask_runtime.py
      - app/damage_taxonomy.py
      - tests/test_reference_first_route.py
      - .github/workflows/research-reference-first-route.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-first-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install narrow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3' 'opencv-python>=4.10,<5'
      - name: Verify reference-first provenance and immutable MAIN contract
        run: python -m pytest -q tests/test_reference_first_route.py
