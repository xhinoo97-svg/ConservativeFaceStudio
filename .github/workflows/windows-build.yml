name: Windows build

on:
  push:
    branches: [main, feature/block-pipeline-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify imports and model manifests
        shell: pwsh
        run: |
          python -m compileall -q app tests scripts
          python -c "import app; import cv2; import numpy; import onnxruntime; import PySide6; import app.project; import app.alignment; import app.history; import app.exporting; import app.execution; import app.safety; import app.benchmark; import app.imaging; import app.validation; import app.validation_suite; import app.practical_benchmark; import app.practical_benchmark_matrix; import app.regional_fusion; import app.standard_pretrained; import app.opencv_nafnet; import app.opencv_semantic_models; import app.pretrained_semantic_handlers; import app.opencv_lama; import app.reference_inpainting; import app.pretrained_inpaint_handler; import app.installation_verifier; from app.model_catalog import all_model_manifests; from app.pretrained_values import validate_defaults; from app.model_registry import validate_manifest; [validate_manifest(m) for m in all_model_manifests()]; validate_defaults(); assert int(cv2.__version__.split('.')[0]) >= 5"

      - name: Run tests
        run: python -m pytest -q

      - name: Conservative validation suite
        shell: pwsh
        run: python -m app.validation_suite --output validation-report.json --fail-on-regression

      - name: CPU smoke benchmark
        shell: pwsh
        run: python -m app.benchmark --width 768 --height 512 --output benchmark-windows-ci.json

      - name: Prefetch public benchmark portraits
        shell: pwsh
        run: python scripts/prefetch_public_portraits.py --cache .benchmark-cache/public-portraits --limit 10

      - name: Practical public-portrait benchmark
        shell: pwsh
        run: |
          python scripts/run_face_anchored_practical_benchmark.py --output practical-benchmark --cache .benchmark-cache/public-portraits --limit 10 --size 320 --profile quick
          $report = Get-Content practical-benchmark/practical-benchmark.json -Raw | ConvertFrom-Json
          $errors = @($report.cases | Where-Object { $_.error })
          Write-Host "Practical benchmark errors: $($errors.Count)"
          $errors | ForEach-Object { Write-Host "ERROR portrait=$($_.portrait) scenario=$($_.scenario) message=$($_.error)" }
          if ($errors.Count -gt 0) { throw "Practical benchmark contains runtime errors" }

      - name: Extended practical degradation matrix
        shell: pwsh
        run: |
          python -m app.practical_benchmark_matrix --output practical-matrix --cache .benchmark-cache/public-portraits --limit 10 --size 256
          $report = Get-Content practical-matrix/practical-matrix.json -Raw | ConvertFrom-Json
          $errors = @($report.cases | Where-Object { $_.error })
          Write-Host "Extended matrix errors: $($errors.Count)"
          $errors | ForEach-Object { Write-Host "ERROR portrait=$($_.portrait) scenario=$($_.scenario) message=$($_.error)" }
          if ($errors.Count -gt 0) { throw "Extended practical matrix contains runtime errors" }

      - name: Practical quality report (deferred tuning)
        shell: pwsh
        run: |
          $totalErrors = 0
          foreach ($path in @('practical-benchmark/practical-benchmark.json','practical-matrix/practical-matrix.json')) {
            if (!(Test-Path $path)) { throw "Missing benchmark report: $path" }
            $report = Get-Content $path -Raw | ConvertFrom-Json
            $totalErrors += @($report.cases | Where-Object { $_.error }).Count
          }
          if ($totalErrors -gt 0) { throw "Practical benchmark contains $totalErrors runtime error case(s)" }
          $practical = Get-Content practical-benchmark/practical-benchmark.json -Raw | ConvertFrom-Json
          $failed95 = @($practical.cases | Where-Object { $_.target95_applicable -eq $true -and $_.target95_passed -ne $true })
          Write-Host "Recoverable target95 failures (post-completion tuning backlog): $($failed95.Count)"
          $failed95 | ForEach-Object { Write-Host "QUALITY_DEFERRED portrait=$($_.portrait) scenario=$($_.scenario) score=$($_.conservative_recovery_score)" }
          if ($failed95.Count -gt 0) {
            Write-Warning "TARGET95 fine tuning is deferred until the Windows product, offline models, portable ZIP and installer are complete."
          }

      - name: Export model manifest catalog
        shell: pwsh
        run: python -c "from app.model_catalog import all_model_manifests; from app.model_registry import export_registry; export_registry('models/model-manifests.json', all_model_manifests())"

      - name: Free build cache before PyInstaller
        shell: pwsh
        run: |
          python -m pip cache purge
          if (Test-Path '.pytest_cache') { Remove-Item '.pytest_cache' -Recurse -Force }
          if (Test-Path '.benchmark-cache') { Remove-Item '.benchmark-cache' -Recurse -Force }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free -AutoSize

      - name: Build Windows executable
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Bootstrap verified production models for offline installer
        shell: pwsh
        run: |
          python -c "from app.production_models import ensure_production_pretrained_models; b=ensure_production_pretrained_models('.', face_timeout_seconds=60, restoration_timeout_seconds=180); print({k:str(v) for k,v in b.paths.items()}); print(b.errors); assert b.face_ready and b.standard_ready and b.inpaint_ready, b.errors"

      - name: Real YuNet and SFace CPU smoke test
        shell: pwsh
        run: python scripts/smoke_production_models.py --only face

      - name: Real NAFNet CPU smoke test
        shell: pwsh
        run: python scripts/smoke_production_models.py --only nafnet

      - name: Real face-parsing CPU smoke test
        shell: pwsh
        run: python scripts/smoke_production_models.py --only parsing

      - name: Real head-pose CPU smoke test
        shell: pwsh
        run: python scripts/smoke_production_models.py --only headpose

      - name: Real LaMa ONNX Runtime smoke test
        shell: pwsh
        run: python scripts/smoke_lama_runtime.py

      - name: Export verified runtime model registry
        shell: pwsh
        run: |
          python -c "from app.model_runtime_registry import export_runtime_registry; export_runtime_registry('models/model-registry.json','.')"
          $registry = Get-Content models/model-registry.json -Raw | ConvertFrom-Json
          $production = @($registry.models | Where-Object { $_.status -in @('ACTIVE','FALLBACK') })
          if ($production.Count -lt 6) { throw "Runtime registry missing production backends" }
          foreach ($model in $production) {
            if ($model.installed -ne $true) { throw "Production backend not installed: $($model.key)" }
            if ($model.checksum_ok -ne $true) { throw "Production backend checksum not verified: $($model.key)" }
          }

      - name: Stage verified production models
        shell: pwsh
        run: .\scripts\stage_production_models.ps1

      - name: Smoke and offline test portable package
        shell: pwsh
        run: |
          $exePath = "dist\ConservativeFaceStudio\ConservativeFaceStudio.exe"
          if (!(Test-Path $exePath)) { throw "Executable missing" }
          foreach ($dir in @('models','exports','projects')) {
            if (!(Test-Path "dist\ConservativeFaceStudio\$dir")) { throw "$dir directory missing" }
          }
          if (!(Test-Path "dist\ConservativeFaceStudio\models\model-registry.json")) { throw "Model registry missing" }
          $registry = Get-Content "dist\ConservativeFaceStudio\models\model-registry.json" -Raw | ConvertFrom-Json
          if (@($registry.models).Count -lt 10) { throw "Model registry incomplete" }
          foreach ($entry in @($registry.models | Where-Object { $_.status -in @('ACTIVE','FALLBACK') })) {
            if ($entry.installed -ne $true) { throw "Packaged ACTIVE/FALLBACK model missing: $($entry.key)" }
            if ($entry.checksum_ok -ne $true) { throw "Packaged ACTIVE/FALLBACK checksum invalid: $($entry.key)" }
          }
          $exe = Get-Item $exePath
          if ($exe.Length -lt 1MB) { throw "Executable unexpectedly small" }
          foreach ($arg in @('--smoke-test','--verify-installation','--offline-test')) {
            $process = Start-Process -FilePath $exe.FullName -ArgumentList $arg -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "Packaged executable $arg failed with exit code $($process.ExitCode)" }
          }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\ConservativeFaceStudio\* -DestinationPath ConservativeFaceStudio-Windows-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ConservativeFaceStudio.iss"
          if (!(Test-Path "dist-installer\ConservativeFaceStudio-Setup-x64.exe")) { throw "Installer missing" }
          if ((Get-Item "dist-installer\ConservativeFaceStudio-Setup-x64.exe").Length -lt 1MB) { throw "Installer unexpectedly small" }

      - name: Verify installed package offline
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist-installer\ConservativeFaceStudio-Setup-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "ConservativeFaceStudio-installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer execution failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $installDir "ConservativeFaceStudio.exe"
          if (!(Test-Path $installedExe)) { throw "Installed executable missing" }
          foreach ($arg in @('--verify-installation','--offline-test')) {
            $process = Start-Process -FilePath $installedExe -ArgumentList $arg -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "Installed executable $arg failed with exit code $($process.ExitCode)" }
          }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = @(
            'dist-installer\ConservativeFaceStudio-Setup-x64.exe',
            'ConservativeFaceStudio-Windows-x64.zip'
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload one-click Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ConservativeFaceStudio-Setup-Windows-x64
          path: dist-installer/ConservativeFaceStudio-Setup-x64.exe
          compression-level: 0
          retention-days: 14

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ConservativeFaceStudio-Portable-Windows-x64
          path: ConservativeFaceStudio-Windows-x64.zip
          compression-level: 0
          retention-days: 14

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: ConservativeFaceStudio-Release-Metadata
          path: |
            SHA256SUMS.txt
            models/model-registry.json
            models/model-manifests.json
            validation-report.json
            benchmark-windows-ci.json
          retention-days: 14

      - name: Upload validation reports and practical visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ConservativeFaceStudio-Validation
          path: |
            benchmark-windows-ci.json
            validation-report.json
            practical-benchmark/**/*
            practical-matrix/**/*
          if-no-files-found: warn
          retention-days: 14
