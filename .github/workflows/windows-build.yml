name: Windows build

on:
  push:
    branches: [main, feature/block-pipeline-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify imports and model manifests
        shell: pwsh
        run: |
          python -m compileall -q app tests
          python -c "import app; import cv2; import numpy; import PySide6; import app.project; import app.alignment; import app.history; import app.exporting; import app.execution; import app.safety; import app.benchmark; import app.imaging; import app.validation; import app.validation_suite; import app.regional_fusion; import app.standard_pretrained; import app.opencv_nafnet; import app.opencv_semantic_models; import app.pretrained_semantic_handlers; import app.opencv_lama; import app.reference_inpainting; import app.pretrained_inpaint_handler; from app.model_catalog import all_model_manifests; from app.pretrained_values import validate_defaults; from app.model_registry import validate_manifest; [validate_manifest(m) for m in all_model_manifests()]; validate_defaults(); assert int(cv2.__version__.split('.')[0]) >= 5"

      - name: Run tests
        run: python -m pytest -q

      - name: Conservative validation suite
        shell: pwsh
        run: python -m app.validation_suite --output validation-report.json --fail-on-regression

      - name: CPU smoke benchmark
        shell: pwsh
        run: python -m app.benchmark --width 768 --height 512 --output benchmark-windows-ci.json

      - name: Export model registry
        shell: pwsh
        run: python -c "from app.model_catalog import all_model_manifests; from app.model_registry import export_registry; export_registry('models/model-registry.json', all_model_manifests())"

      - name: Bootstrap verified production models for offline installer
        shell: pwsh
        run: |
          python -c "from app.production_models import ensure_production_pretrained_models; b=ensure_production_pretrained_models('.', face_timeout_seconds=60, restoration_timeout_seconds=180); print({k:str(v) for k,v in b.paths.items()}); print(b.errors); assert b.face_ready and b.standard_ready and b.inpaint_ready, b.errors"

      - name: Build Windows executable
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Smoke test portable package
        shell: pwsh
        run: |
          if (!(Test-Path "dist\ConservativeFaceStudio\ConservativeFaceStudio.exe")) { throw "Executable missing" }
          foreach ($dir in @('models','exports','projects')) {
            if (!(Test-Path "dist\ConservativeFaceStudio\$dir")) { throw "$dir directory missing" }
          }
          if (!(Test-Path "dist\ConservativeFaceStudio\models\model-registry.json")) { throw "Model registry missing" }
          $registry = Get-Content "dist\ConservativeFaceStudio\models\model-registry.json" -Raw | ConvertFrom-Json
          if ($registry.Count -lt 10) { throw "Model registry incomplete" }
          foreach ($model in @(
            'models\yunet\face_detection_yunet_2023mar.onnx',
            'models\sface\face_recognition_sface_2021dec.onnx',
            'models\nafnet\deblurring_nafnet_2025may.onnx',
            'models\face_parsing\resnet18.onnx',
            'models\head_pose\mobilenetv2.onnx',
            'models\lama\inpainting_lama_2025jan.onnx'
          )) {
            if (!(Test-Path "dist\ConservativeFaceStudio\$model")) { throw "Bundled production model missing: $model" }
          }
          $exe = Get-Item "dist\ConservativeFaceStudio\ConservativeFaceStudio.exe"
          if ($exe.Length -lt 1MB) { throw "Executable unexpectedly small" }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Packaged executable smoke test failed with exit code $($process.ExitCode)" }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\ConservativeFaceStudio\* -DestinationPath ConservativeFaceStudio-Windows-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\ConservativeFaceStudio.iss"
          if (!(Test-Path "dist-installer\ConservativeFaceStudio-Setup-x64.exe")) { throw "Installer missing" }
          if ((Get-Item "dist-installer\ConservativeFaceStudio-Setup-x64.exe").Length -lt 1MB) { throw "Installer unexpectedly small" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ConservativeFaceStudio-Windows-x64
          path: |
            ConservativeFaceStudio-Windows-x64.zip
            dist-installer/ConservativeFaceStudio-Setup-x64.exe
            benchmark-windows-ci.json
            validation-report.json
          retention-days: 14
