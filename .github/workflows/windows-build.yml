name: Windows build

on:
  push:
    branches: [main, feature/block-pipeline-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify imports
        run: python -c "import app; import cv2; import numpy; import PySide6"

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Smoke test package
        shell: pwsh
        run: |
          if (!(Test-Path "dist\ConservativeFaceStudio\ConservativeFaceStudio.exe")) { throw "Executable missing" }
          if (!(Test-Path "dist\ConservativeFaceStudio\models")) { throw "Models directory missing" }
          if (!(Test-Path "dist\ConservativeFaceStudio\exports")) { throw "Exports directory missing" }
          if (!(Test-Path "dist\ConservativeFaceStudio\projects")) { throw "Projects directory missing" }

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\ConservativeFaceStudio\* -DestinationPath ConservativeFaceStudio-Windows-x64.zip -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ConservativeFaceStudio-Windows-x64
          path: ConservativeFaceStudio-Windows-x64.zip
          retention-days: 14
